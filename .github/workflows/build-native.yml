name: KennyPvtHax Recovery Stage 1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    name: Original-source and UI host checks
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify golden runtime source and all original dependencies
        run: python3 tests/recovery_source_check.py
      - name: Host-test original widgets with recovery chrome
        shell: bash
        run: |
          timeout 180s g++ -std=c++17 -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie \
            -I jni -I .verification tests/recovery_host_check.cpp \
            jni/imgui/imgui.cpp jni/imgui/imgui_draw.cpp \
            jni/imgui/imgui_widgets.cpp jni/imgui/imgui_tables.cpp \
            -o .verification/recovery-host
          timeout 90s .verification/recovery-host
  build:
    name: Build original-based ARM64 Stage 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      NDK_VERSION: "25.2.9519653"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install existing r25c toolchain
        shell: bash
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$NDK/ndk-build"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Verify original SDK build inputs
        shell: bash
        run: |
          test -s jni/SDK/PUBGM_BangJO.hpp
          for f in PUBGM_Basic.cpp PUBGM_Basic_functions.cpp PUBGM_CoreUObject_functions.cpp PUBGM_Engine_functions.cpp PUBGM_ShadowTrackerExtra_functions.cpp PUBGM_Client_functions.cpp; do
            test -s "jni/SDK/$f"
          done
      - name: Build without redesigned startup/audio/diagnostic options
        shell: bash
        run: |
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk -j2
      - name: Verify release artifact and record identity
        shell: bash
        run: |
          set -euo pipefail
          SO="libs/arm64-v8a/libAnoy.so"
          test -s "$SO"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p .verification
          "$READELF" -h "$SO" > .verification/elf-header.txt
          grep -q AArch64 .verification/elf-header.txt
          "$READELF" -n "$SO" > .verification/elf-notes.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "foundation=b73a33a (original anony.zip)"
            echo "ndk=$NDK_VERSION"
            echo "stage=recovery-1-ui-only"
            echo "audio=not-linked; aurora/anime/launcher=not-compiled"
            echo "original_build_scripts_and_runtime_retained=true"
            sha256sum "$SO"
            cat .verification/elf-notes.txt
          } > .verification/recovery-build-info.txt
      - name: Upload separate Stage 1 runtime only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KennyPvtHax-Recovery-Stage1-ARM64
          path: |
            libs/arm64-v8a/libAnoy.so
            .verification/recovery-build-info.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
